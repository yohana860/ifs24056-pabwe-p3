<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NexaHub — aplikasi produktivitas ringan untuk mengelola pengeluaran, bookmark, dan kuis interaktif.">
  <title>NexaHub — Productivity Hub</title>

  <!-- Google Fonts + Lucide Icons via CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg: #f6f7fb;
      --surface: #ffffff;
      --surface-soft: #f8f9fc;
      --text: #172033;
      --muted: #6f7890;
      --border: #e7eaf1;
      --primary: #5148d9;
      --primary-dark: #5048e5;
      --primary-soft: #efeeff;
      --success: #12a36a;
      --success-soft: #e7f8f0;
      --danger: #e14d5d;
      --danger-soft: #fff0f2;
      --warning: #d58b12;
      --warning-soft: #fff7e6;
      --shadow: 0 16px 50px rgba(25, 35, 60, .08);
      --shadow-sm: 0 5px 20px rgba(25, 35, 60, .06);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 11px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 0%, rgba(99,91,255,.09), transparent 28rem),
        radial-gradient(circle at 100% 10%, rgba(18,163,106,.07), transparent 25rem),
        var(--bg);
      color: var(--text);
      font-family: "DM Sans", sans-serif;
      line-height: 1.5;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    [hidden] { display: none !important; }

    .app-shell {
      width: min(1240px, calc(100% - 32px));
      margin: 0 auto;
      padding: 26px 0 44px;
    }

    header.topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }
    .brand-mark {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      color: white;
      border-radius: 15px;
      background: linear-gradient(135deg, var(--primary), #8b7cff);
      box-shadow: 0 10px 24px rgba(99,91,255,.25);
    }
    .brand-mark svg { width: 22px; height: 22px; }
    .brand h1 {
      font: 800 20px/1 "Plus Jakarta Sans", sans-serif;
      letter-spacing: -.04em;
      margin: 0;
    }
    .brand p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      background: rgba(255,255,255,.78);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      box-shadow: var(--shadow-sm);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(18,163,106,.10);
    }

    .hero {
      display: grid;
      grid-template-columns: 1.4fr .6fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .hero-card, .insight-card {
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(231,234,241,.9);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }
    .hero-card {
      padding: 28px;
      position: relative;
      overflow: hidden;
    }
    .hero-card::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      right: -70px;
      top: -80px;
      border-radius: 50%;
      background: rgba(99,91,255,.10);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--primary);
      background: var(--primary-soft);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
    }
    .hero h2 {
      max-width: 720px;
      margin: 14px 0 8px;
      font: 800 clamp(25px, 4vw, 40px)/1.12 "Plus Jakarta Sans", sans-serif;
      letter-spacing: -.055em;
    }
    .hero h2 span { color: var(--primary); }
    .hero p {
      margin: 0;
      max-width: 650px;
      color: var(--muted);
      font-size: 14px;
    }
    .insight-card {
      padding: 23px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 180px;
    }
    .insight-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .insight-value {
      font: 800 30px/1.1 "Plus Jakarta Sans", sans-serif;
      letter-spacing: -.04em;
      margin-top: 8px;
    }
    .insight-note { color: var(--muted); font-size: 12px; }

    .tabs {
      position: sticky;
      top: 10px;
      z-index: 10;
      display: flex;
      gap: 6px;
      padding: 6px;
      margin-bottom: 18px;
      overflow-x: auto;
      background: rgba(255,255,255,.88);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(15px);
    }
    .tab-btn {
      flex: 1;
      min-width: 150px;
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 11px;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 700;
      font-size: 13px;
      transition: .2s ease;
    }
    .tab-btn:hover { color: var(--text); background: var(--surface-soft); }
    .tab-btn.active {
      color: var(--primary);
      background: var(--primary-soft);
    }
    .tab-btn svg { width: 17px; }

    .panel {
      display: none;
      animation: panelIn .28s ease;
    }
    .panel.active { display: block; }
    @keyframes panelIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin: 22px 0 14px;
    }
    .section-head h3 {
      margin: 0;
      font: 800 22px/1.2 "Plus Jakarta Sans", sans-serif;
      letter-spacing: -.04em;
    }
    .section-head p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 13px;
      margin-bottom: 16px;
    }
    .stat {
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }
    .stat-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .stat-icon {
      width: 34px; height: 34px;
      display: grid; place-items: center;
      border-radius: 10px;
      background: var(--surface-soft);
    }
    .stat-icon svg { width: 17px; }
    .stat-value {
      margin-top: 13px;
      font: 800 22px/1.1 "Plus Jakarta Sans", sans-serif;
      letter-spacing: -.03em;
      overflow-wrap: anywhere;
    }
    .stat.income .stat-icon { color: var(--success); background: var(--success-soft); }
    .stat.expense .stat-icon { color: var(--danger); background: var(--danger-soft); }
    .stat.balance .stat-icon { color: var(--primary); background: var(--primary-soft); }

    .workspace {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 16px;
      align-items: start;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }
    .form-card {
      padding: 20px;
      position: sticky;
      top: 88px;
    }
    .card-title {
      margin: 0 0 3px;
      font: 800 16px "Plus Jakarta Sans", sans-serif;
      letter-spacing: -.025em;
    }
    .card-subtitle { color: var(--muted); font-size: 12px; margin: 0 0 17px; }

    .field { margin-bottom: 13px; }
    .field label {
      display: block;
      margin: 0 0 6px;
      font-size: 12px;
      font-weight: 700;
      color: #4d566c;
    }
    .input, .select, .textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 12px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: .2s;
    }
    .textarea { min-height: 88px; resize: vertical; }
    .input:focus, .select:focus, .textarea:focus {
      border-color: rgba(99,91,255,.55);
      box-shadow: 0 0 0 4px rgba(99,91,255,.10);
    }
    .input.invalid, .select.invalid, .textarea.invalid {
      border-color: var(--danger);
      box-shadow: 0 0 0 4px rgba(225,77,93,.08);
    }
    .form-error {
      min-height: 16px;
      margin: 5px 0 0;
      color: var(--danger);
      font-size: 11px;
    }

    .btn {
      border: 0;
      border-radius: 11px;
      padding: 11px 14px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      font-weight: 700;
      font-size: 12px;
      transition: .2s ease;
    }
    .btn svg { width: 16px; }
    .btn-primary {
      width: 100%;
      color: white;
      background: linear-gradient(135deg, var(--primary), #7a71ff);
      box-shadow: 0 9px 18px rgba(99,91,255,.18);
    }
    .btn-primary:hover { transform: translateY(-1px); background: var(--primary-dark); }
    .btn-soft { color: var(--primary); background: var(--primary-soft); }
    .btn-soft:hover { background: #e7e5ff; }
    .btn-ghost { color: var(--muted); background: var(--surface-soft); }
    .btn-danger { color: var(--danger); background: var(--danger-soft); }
    .btn-success { color: var(--success); background: var(--success-soft); }
    .btn-sm { padding: 8px 10px; font-size: 11px; }

    .toolbar {
      padding: 13px;
      display: grid;
      grid-template-columns: 1.5fr .75fr .75fr;
      gap: 9px;
      margin-bottom: 11px;
    }
    .toolbar .input, .toolbar .select { padding: 10px 11px; }
    .items { display: grid; gap: 9px; }
    .item {
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      transition: .2s;
    }
    .item:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
      border-color: #dfe2eb;
    }
    .item-main {
      display: flex;
      justify-content: space-between;
      gap: 13px;
      align-items: flex-start;
    }
    .item-title {
      margin: 0;
      font: 700 14px "Plus Jakarta Sans", sans-serif;
      letter-spacing: -.015em;
    }
    .item-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-top: 7px;
      color: var(--muted);
      font-size: 11px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 5px 8px;
      font-size: 10px;
      font-weight: 700;
      background: var(--surface-soft);
      color: var(--muted);
    }
    .badge-income { background: var(--success-soft); color: var(--success); }
    .badge-expense { background: var(--danger-soft); color: var(--danger); }
    .badge-primary { background: var(--primary-soft); color: var(--primary); }
    .amount { font: 800 15px "Plus Jakarta Sans", sans-serif; white-space: nowrap; }
    .amount.income { color: var(--success); }
    .amount.expense { color: var(--danger); }
    .item-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #f0f1f5;
    }

    .empty {
      padding: 48px 22px;
      text-align: center;
      border: 1px dashed #d9dce5;
      border-radius: var(--radius-lg);
      background: rgba(255,255,255,.6);
    }
    .empty-icon {
      width: 50px; height: 50px; margin: 0 auto 12px;
      display: grid; place-items: center;
      border-radius: 15px;
      color: var(--primary);
      background: var(--primary-soft);
    }
    .empty h4 { margin: 0 0 4px; font: 800 15px "Plus Jakarta Sans", sans-serif; }
    .empty p { max-width: 380px; margin: 0 auto; color: var(--muted); font-size: 12px; }

    /* Bookmark */
    .bookmark-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 11px;
    }
    .bookmark-card {
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }
    .bookmark-top {
      display: flex;
      gap: 11px;
      align-items: flex-start;
    }
    .site-icon {
      flex: 0 0 39px;
      width: 39px; height: 39px;
      display: grid; place-items: center;
      border-radius: 11px;
      color: var(--primary);
      background: var(--primary-soft);
      font-weight: 800;
      text-transform: uppercase;
    }
    .bookmark-card h4 {
      margin: 0;
      font: 700 14px "Plus Jakarta Sans", sans-serif;
    }
    .bookmark-url {
      display: block;
      margin-top: 3px;
      color: var(--primary);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-decoration: none;
    }
    .bookmark-url:hover { text-decoration: underline; }
    .bookmark-note {
      margin: 11px 0 0;
      color: var(--muted);
      font-size: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Quiz */
    .quiz-wrap {
      max-width: 850px;
      margin: 0 auto;
    }
    .quiz-card {
      padding: clamp(20px, 4vw, 34px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }
    .quiz-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: center;
      margin-bottom: 17px;
    }
    .progress-wrap { flex: 1; }
    .progress-label {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 7px;
    }
    .progress {
      height: 7px;
      background: #edf0f5;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #8b7cff);
      border-radius: inherit;
      transition: width .3s ease;
    }
    .quiz-question {
      margin: 24px 0 17px;
      font: 800 clamp(21px, 3vw, 28px)/1.25 "Plus Jakarta Sans", sans-serif;
      letter-spacing: -.04em;
    }
    .options { display: grid; gap: 9px; }
    .option {
      position: relative;
      width: 100%;
      padding: 14px 15px;
      display: flex;
      align-items: center;
      gap: 11px;
      text-align: left;
      border: 1px solid var(--border);
      border-radius: 13px;
      color: var(--text);
      background: #fff;
      transition: .2s;
    }
    .option:hover:not(:disabled) {
      border-color: rgba(99,91,255,.45);
      background: #faf9ff;
      transform: translateX(2px);
    }
    .option-key {
      width: 30px; height: 30px;
      flex: 0 0 30px;
      display: grid; place-items: center;
      border-radius: 9px;
      color: var(--muted);
      background: var(--surface-soft);
      font-weight: 800;
      font-size: 11px;
    }
    .option.correct { border-color: rgba(18,163,106,.45); background: var(--success-soft); }
    .option.correct .option-key { color: var(--success); background: #d2f3e3; }
    .option.wrong { border-color: rgba(225,77,93,.45); background: var(--danger-soft); }
    .option.wrong .option-key { color: var(--danger); background: #ffdfe3; }
    .quiz-feedback {
      margin-top: 13px;
      padding: 12px 14px;
      border-radius: 11px;
      font-size: 12px;
      color: var(--muted);
      background: var(--surface-soft);
    }
    .quiz-actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 19px;
    }
    .quiz-actions .btn { width: auto; }
    .quiz-result {
      text-align: center;
      padding: 15px 5px 4px;
    }
    .score-circle {
      width: 110px; height: 110px;
      margin: 5px auto 17px;
      display: grid; place-items: center;
      border-radius: 50%;
      background: var(--primary-soft);
      color: var(--primary);
      font: 800 27px "Plus Jakarta Sans", sans-serif;
      box-shadow: inset 0 0 0 9px #f8f7ff;
    }
    .quiz-result h3 { margin: 0; font: 800 25px "Plus Jakarta Sans", sans-serif; }
    .quiz-result p { color: var(--muted); font-size: 13px; }
    .highscore {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 8px 0 19px;
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--warning-soft);
      color: var(--warning);
      font-size: 11px;
      font-weight: 700;
    }

    footer {
      text-align: center;
      padding-top: 28px;
      color: var(--muted);
      font-size: 11px;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(16,22,38,.45);
      backdrop-filter: blur(5px);
    }
    .modal {
      width: min(500px, 100%);
      max-height: min(760px, calc(100vh - 36px));
      overflow: auto;
      padding: 21px;
      background: var(--surface);
      border-radius: 20px;
      box-shadow: 0 25px 80px rgba(12,18,35,.25);
      animation: modalIn .2s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: translateY(10px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: center;
      margin-bottom: 17px;
    }
    .modal-head h3 { margin: 0; font: 800 18px "Plus Jakarta Sans", sans-serif; }
    .close-btn {
      width: 34px; height: 34px;
      display: grid; place-items: center;
      border: 0;
      border-radius: 10px;
      background: var(--surface-soft);
      color: var(--muted);
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }
    .modal-actions .btn { width: auto; }

    .toast {
      position: fixed;
      z-index: 200;
      right: 18px;
      bottom: 18px;
      width: min(360px, calc(100% - 36px));
      padding: 13px 15px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: #172033;
      color: white;
      border-radius: 13px;
      box-shadow: 0 15px 40px rgba(10,15,30,.22);
      animation: toastIn .25s ease;
      font-size: 12px;
    }
    .toast svg { flex: 0 0 auto; width: 17px; color: #9df1ca; }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 850px) {
      .hero, .workspace { grid-template-columns: 1fr; }
      .form-card { position: static; }
      .bookmark-grid { grid-template-columns: 1fr; }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .toolbar .search { grid-column: 1 / -1; }
    }
    @media (max-width: 620px) {
      .app-shell { width: min(100% - 20px, 1240px); padding-top: 15px; }
      header.topbar { margin-bottom: 14px; }
      .status-pill { display: none; }
      .hero-card { padding: 22px; }
      .hero h2 { font-size: 27px; }
      .stats { grid-template-columns: 1fr; }
      .tabs { top: 5px; }
      .tab-btn { min-width: 125px; padding: 10px 11px; }
      .toolbar { grid-template-columns: 1fr; }
      .toolbar .search { grid-column: auto; }
      .item-main { flex-direction: column; }
      .amount { white-space: normal; }
      .quiz-actions { flex-direction: column-reverse; }
      .quiz-actions .btn { width: 100%; }
    }
  </style>
</head>

<body>
  <div class="app-shell">

    <header class="topbar">
      <!-- isi header kamu -->
    </header>

    <main>

      <section class="hero" aria-label="Pengantar aplikasi">
        <!-- isi hero kamu -->
      </section>

      <nav class="tabs" role="tablist" aria-label="Navigasi fitur">

        <button
          class="tab-btn active"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="panel-expense"
          data-tab="expense"
        >
          <i data-lucide="wallet"></i>
          <span>Pengeluaran</span>
        </button>

        <button
          class="tab-btn"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="panel-bookmark"
          data-tab="bookmark"
        >
          <i data-lucide="bookmark"></i>
          <span>Bookmark</span>
        </button>

        <button
          class="tab-btn"
          type="button"
          role="tab"
